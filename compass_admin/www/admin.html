{% extends "templates/web.html" %}

{% block page_content %}
<div class="compass-admin">
	<h1>{{ title }}</h1>
	<ul class="compass-admin-links">
		{% for link in links %}
		<li><a href="{{ link.url }}" data-link="{{ link.key }}">{{ link.label }}</a></li>
		{% endfor %}
	</ul>
</div>
<style>
	.compass-admin-links { list-style: none; padding: 0; margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
</style>
{% endblock %}
